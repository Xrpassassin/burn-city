name: Estates paused scanner quota measurement
on:
  push:
    branches: [ops/estates-live-activation-442]
    paths: ['.github/workflows/estates-activation-status.yml']
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read deployed status and exact funding requirement
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IOV2 || secrets.FLY_IO }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const endpoint='https://api.machines.dev/v1/apps/burn-city-game/machines/8d2909be270068',headers={Authorization:'Bearer '+process.env.FLY_API_TOKEN,'Content-Type':'application/json'};
          const state=await fetch(endpoint,{headers});if(!state.ok)throw Error('machine_read_failed');const m=await state.json();
          const config={...m.config,env:{...m.config.env,ESTATE_ACCOUNTING_ENABLED:'0',ESTATE_SALES_ENABLED:'0',ESTATE_DISTRIBUTIONS_ENABLED:'0',ESTATE_LIQUIDITY_ENABLED:'0',ESTATE_XRP_PROFIT_HARVEST_ENABLED:'0'}};
          const updated=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify({current_version:m.instance_id,config})});if(!updated.ok)throw Error('disable_gates_http_'+updated.status);
          console.log('Disabled Estates gates for the paused scanner investigation.');
          await new Promise(r=>setTimeout(r,45000));
          const source=fs.readFileSync('scripts/estate-scanner-probe.cjs','utf8');
          for(const mode of ['probe']){
            const r=await fetch('https://api.machines.dev/v1/apps/burn-city-game/machines/8d2909be270068/exec',{method:'POST',headers:{Authorization:'Bearer '+process.env.FLY_API_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({command:['node','-e',source,mode,'640d0f6045adeba27a9ce7c47f3b0726fbda0bb2'],timeout:55}),signal:AbortSignal.timeout(60000)});
            if(!r.ok)throw Error('readonly_status_http_'+r.status);
            const result=await r.json();for(const line of result.stdout.trim().split('\n'))console.log(JSON.stringify(JSON.parse(line)));if(result.exit_code!==0)throw Error('readonly_probe_failed');
          }
          NODE
