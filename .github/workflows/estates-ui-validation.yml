name: Estates directory and responsive UI checks
on:
  pull_request:
    paths:
      - 'client/js/estate-ownership*'
      - 'client/js/estates-island-renderer*'
      - 'client/js/movement-games-menu.js'
      - 'client/js/app.js'
      - 'client/js/estate-portfolio*'
      - 'client/js/estate-reward-scenario*'
      - 'client/estate-properties.html'
      - 'client/estate-buyer-preview.js'
      - 'server/estate-portfolio*'
      - 'server/server.js'
      - 'scripts/estate-portfolio-browser-test.mjs'
      - 'client/js/estates-directory*'
      - 'client/js/estate-purchase-ui.mjs'
      - 'scripts/estate-purchase-browser-test.mjs'
      - 'client/js/estates-panel-layout*'
      - 'client/js/estates-plot-separation.test.mjs'
      - 'client/js/estates-island-scene.mjs'
      - 'client/js/estates-island-live.mjs'
      - 'scripts/estates-directory-browser-test.mjs'
      - '.github/workflows/estates-ui-validation.yml'
  workflow_dispatch:
jobs:
  estates-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live host syntax
        run: node --check client/js/estates-island-live.mjs
      - name: Test directory, panel layout, and plot setbacks
        run: node --test client/js/estates-directory.test.mjs client/js/estates-panel-layout.test.mjs client/js/estates-plot-separation.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify honest Estates purchase disclosures and disabled payment controls
        run: node scripts/estate-purchase-browser-test.mjs
      - name: Browser directory, walking guidance and nearby inspection
        run: node scripts/estates-directory-browser-test.mjs
      - name: Portfolio accounting and hypothetical allocation tests
        run: node server/estate-portfolio.test.js && node client/js/estate-reward-scenario.test.mjs
      - name: Browser owned properties, wallet isolation, scenarios and live status
        run: node scripts/estate-portfolio-browser-test.mjs
