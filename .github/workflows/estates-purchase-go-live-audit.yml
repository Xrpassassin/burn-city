name: Estates purchase go-live safety audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/estates-purchase-go-live-audit.yml'
      - 'server/estate-sales-runtime.js'
      - 'server/estate-sale-production-gates.test.js'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify sales fail closed in repository tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node server/estate-sale-production-gates.test.js
      - name: Inspect public deployed purchase status without signing or exposing secrets
        run: |
          node --input-type=module <<'NODE'
          const url='https://burn-city-game.fly.dev/api/estates/status';
          const response=await fetch(url,{signal:AbortSignal.timeout(15000)});
          if(!response.ok)throw Error('estates_status_http_'+response.status);
          const data=await response.json();
          const policy=data.capitalAllocationPolicy??{};
          const summary={
            publicStatusReachable:true,
            salesEnabled:data.salesEnabled===true,
            salesStatus:typeof data.salesStatus==='string'?data.salesStatus:'unknown',
            distributionsEnabled:data.distributionsEnabled===true,
            imgRlusdFundingEnabled:data.imgRlusdFundingEnabled===true,
            fundingPolicyMatches:policy.pair==='IMG/RLUSD',
            noGuaranteedRewards:data.rewardsGuaranteed===false
          };
          console.log('ESTATES_PUBLIC_READINESS='+JSON.stringify(summary));
          const blockers=[
            ...(!summary.fundingPolicyMatches?['funding_policy_unverified']:[]),
            ...(!summary.imgRlusdFundingEnabled?['funding_disabled']:[]),
            ...(!summary.salesEnabled?['sales_disabled']:[]),
            ...(!summary.noGuaranteedRewards?['reward_disclosure_mismatch']:[])
          ];
          const report={...summary,blockers,requiresManualReview:[
            'legal_counsel_clearance','independent_treasury_signer_reserve_validation',
            'treasury_pause_and_pending_transaction_review','validated_testnet_and_first_mainnet_purchase_reconciliation',
            'versioned_purchase_terms_and_acceptance'
          ]};
          const md='## Estates purchase go-live audit (read only)\n\n```json\n'+JSON.stringify(report,null,2)+'\n```\n\nA passing workflow does not authorize payments, remove legal holds, or verify a mainnet purchase.\n';
          const fs=await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,md);
          NODE
      - name: Read-only live treasury pause and database gate inspection
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IOV2 || secrets.FLY_IO }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          if(!process.env.FLY_API_TOKEN)throw Error('fly_credential_missing');
          const url='https://api.machines.dev/v1/apps/burn-city-game/machines/8d2909be270068/exec';
          const script=fs.readFileSync('scripts/estate-runtime-readiness.cjs','utf8');
          const response=await fetch(url,{
            method:'POST',
            headers:{authorization:'Bearer '+process.env.FLY_API_TOKEN,'content-type':'application/json'},
            body:JSON.stringify({command:['node','-e',script],timeout:45}),
            signal:AbortSignal.timeout(60000)
          });
          if(!response.ok)throw Error('fly_readonly_inspection_http_'+response.status);
          const run=await response.json();
          if(run.exit_code!==0)throw Error('fly_readonly_inspection_failed');
          const report=JSON.parse(String(run.stdout||'').trim());
          if(report.readOnly!==true)throw Error('unexpected_non_readonly_result');
          const checks={
            readOnly:true,
            salesFlag:report.estateSalesEnabled,
            accountingFlag:report.estateAccountingEnabled,
            liquidityFlag:report.estateLiquidityEnabled,
            distributionsFlag:report.estateDistributionsEnabled,
            dryRun:report.dryRun,
            xamanConfigured:report.xamanConfigured,
            signerConfigured:report.signerConfigured,
            signerMatchesTreasury:report.signerMatchesEstateTreasury,
            environmentPause:report.pauseEnvironment,
            pauseFile:report.pauseFile,
            databasePresent:report.database?.exists===true,
            databaseReadFailed:report.database?.readFailed===true,
            tableCounts:Object.fromEntries(Object.entries(report.database?.tables||{}).map(([k,v])=>[k,{exists:v.exists,rows:v.rows}]))
          };
          console.log('ESTATES_TREASURY_READONLY='+JSON.stringify(checks));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n## Live treasury read-only diagnostic\n\n```json\n'+JSON.stringify(checks,null,2)+'\n```\n');
          NODE
      - name: Validate paused AMM withdrawal on XRPL without signing
        run: |
          node --input-type=module <<'NODE'
          const hash='581A03641BFCD81CEFDD3275ED90B396C96A0AE33D79CFD94CEF3DBA65C6ECE2';
          const request={method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({method:'tx',params:[{transaction:hash,binary:false}]})};
          let result;
          for(const host of ['https://s1.ripple.com:51234/','https://xrplcluster.com/']){
            try {
              const response=await fetch(host,{...request,signal:AbortSignal.timeout(12000)});
              if(!response.ok)continue;
              const body=await response.json();
              if(body.result?.validated===true){result=body.result;break;}
            }catch{}
          }
          if(!result)throw Error('validated_transaction_not_obtained');
          const tx=result.tx_json||result;
          const check={hash,validated:result.validated===true,ledgerIndex:result.ledger_index,
            accountMatchesTreasury:tx.Account==='rwfnp2k2jU8VeFbkK85AJqu2NyAjtiaEpb',
            type:tx.TransactionType,engineResult:result.meta?.TransactionResult,
            asset:tx.Asset,asset2:tx.Asset2,
            feeDrops:tx.Fee,
            affectedNodeTypes:[...new Set((result.meta?.AffectedNodes||[]).map(n=>Object.keys(n)[0]))]};
          console.log('ESTATES_PAUSED_WITHDRAWAL='+JSON.stringify(check));
          const fs=await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n## Paused withdrawal validated-ledger evidence\n\n```json\n'+JSON.stringify(check,null,2)+'\n```\n');
          if(check.type!=='AMMWithdraw'||!check.accountMatchesTreasury||check.engineResult!=='tesSUCCESS')
            throw Error('withdrawal_requires_manual_investigation');
          NODE
      - name: Compare paused withdrawal to durable treasury journal and capital state (read only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IOV2 || secrets.FLY_IO }}
        run: |
          node --input-type=module <<'NODE'
          const script=`
          const {DatabaseSync}=require('node:sqlite');
          const db=new DatabaseSync((process.env.DATA_DIR||'/data')+'/shop.db',{readOnly:true});
          db.exec('PRAGMA query_only=ON');
          const hash='581A03641BFCD81CEFDD3275ED90B396C96A0AE33D79CFD94CEF3DBA65C6ECE2';
          const tables=['estate_capital_allocations','estate_liquidity_jobs','estate_treasury_transactions'];
          const result={readOnly:true,withdrawalHash:hash,tables:{}};
          for(const name of tables){
            const columns=db.prepare('PRAGMA table_info('+name+')').all().map(c=>c.name);
            const rows=db.prepare('SELECT * FROM '+name+' LIMIT 100').all();
            result.tables[name]={total:db.prepare('SELECT COUNT(*) n FROM '+name).get().n,
              rows:rows.map(r=>{
                const kept={};
                for(const key of ['state','pair','policy_version','note','img_plx_drops','img_xrp_drops','img_rlusd_drops','operating_reserve_drops','purchase_drops','tx_type','kind']){
                  if(columns.includes(key))kept[key]=r[key];
                }
                const matches=Object.entries(r).filter(([key,value])=>typeof value==='string'&&value.toUpperCase().includes(hash));
                kept.containsPausedWithdrawal=matches.length>0;
                kept.matchingColumns=matches.map(([key])=>key);
                return kept;
              })};
          }
          db.close();console.log(JSON.stringify(result));
          `;
          const url='https://api.machines.dev/v1/apps/burn-city-game/machines/8d2909be270068/exec';
          const response=await fetch(url,{method:'POST',
            headers:{authorization:'Bearer '+process.env.FLY_API_TOKEN,'content-type':'application/json'},
            body:JSON.stringify({command:['node','-e',script],timeout:30}),
            signal:AbortSignal.timeout(50000)});
          if(!response.ok)throw Error('treasury_journal_read_http_'+response.status);
          const output=await response.json();
          if(output.exit_code!==0)throw Error('treasury_journal_read_failed');
          const data=JSON.parse(String(output.stdout||'').trim());
          if(data.readOnly!==true)throw Error('not_readonly');
          console.log('ESTATES_WITHDRAWAL_RECONCILIATION='+JSON.stringify(data));
          const fs=await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n## Treasury journal reconciliation (read only)\n\n```json\n'+JSON.stringify(data,null,2)+'\n```\n');
          NODE
      - name: Inspect paused withdrawal's ledger impact (read only)
        run: |
          node --input-type=module <<'NODE'
          const h='581A03641BFCD81CEFDD3275ED90B396C96A0AE33D79CFD94CEF3DBA65C6ECE2';
          const resp=await fetch('https://s1.ripple.com:51234/',{
            method:'POST',
            headers:{'content-type':'application/json'},
            body:JSON.stringify({method:'tx',params:[{transaction:h,binary:false}]}),
            signal:AbortSignal.timeout(15000)
          });
          if(!resp.ok)throw Error('ledger_unavailable');
          const data=(await resp.json()).result;
          if(data.validated!==true||data.meta?.TransactionResult!=='tesSUCCESS')throw Error('withdrawal_not_validated');
          const affected=(data.meta.AffectedNodes||[]).map(x=>x.ModifiedNode||x.DeletedNode||x.CreatedNode).filter(Boolean);
          const summary={validated:true,ledger:data.ledger_index,
            types:affected.reduce((acc,x)=>(acc[x.LedgerEntryType]=(acc[x.LedgerEntryType]||0)+1,acc),{}),
            accountingReconciled:false};
          console.log('WITHDRAWAL_EFFECTS='+JSON.stringify(summary));
          NODE
