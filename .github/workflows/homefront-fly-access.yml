name: Fly Homefront preview access check
on:
  push:
    branches: [ops/homefront-fly-access]
  workflow_dispatch:

permissions: {}

jobs:
  access:
    if: github.repository == 'Xrpassassin/burn-city' && github.ref == 'refs/heads/ops/homefront-fly-access'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check both existing tokens with read-only Fly requests
        env:
          FLY_PRIMARY: ${{ secrets.FLY_IOV2 }}
          FLY_SECONDARY: ${{ secrets.FLY_IO }}
        run: |
          probe() {
            local label="$1" token="$2" app code
            if [[ -z "$token" ]]; then
              printf '%s is unavailable to this workflow\n' "$label"
              return
            fi
            for app in burn-city-game burn-city-homefront-preview-551; do
              code=$(curl --silent --max-time 10 --output /dev/null --write-out '%{http_code}' \
                --proto '=https' --request GET --header "Authorization: Bearer $token" \
                "https://api.machines.dev/v1/apps/$app/machines") || code=unreachable
              printf '%s %s GET machines: %s\n' "$label" "$app" "$code"
            done
          }
          probe FLY_IOV2 "$FLY_PRIMARY"
          probe FLY_IO "$FLY_SECONDARY"
          node --input-type=module <<'JS'
          const api = 'https://api.machines.dev/v1/apps';
          for (const [label, token] of [['FLY_IOV2', process.env.FLY_PRIMARY], ['FLY_IO', process.env.FLY_SECONDARY]]) {
            if (!token) continue;
            try {
              const get = url => fetch(url, {
                headers: {authorization: 'Bearer ' + token},
                redirect: 'error', signal: AbortSignal.timeout(10000)
              });
              const live = await get(api + '/burn-city-game');
              console.log(label, 'live app metadata:', live.status);
              if (!live.ok) continue;
              const slug = (await live.json())?.organization?.slug;
              if (!slug) { console.log(label, 'organization unavailable'); continue; }
              const apps = await get(api + '?org_slug=' + encodeURIComponent(slug));
              console.log(label, 'organization app list:', apps.status);
              if (!apps.ok) continue;
              const result = await apps.json();
              const entries = Array.isArray(result) ? result : result.apps;
              if (!Array.isArray(entries)) { console.log(label, 'unrecognized app list format'); continue; }
              const relevant = entries.map(app => app.name).filter(name =>
                typeof name === 'string' && /^[a-z0-9-]+$/.test(name) &&
                (name.startsWith('burn-city-') || name.includes('homefront')));
              console.log(label, 'BURN City or Homefront app names:', relevant.join(', ') || '(none visible)');
            } catch { console.log(label, 'app metadata request failed'); }
          }
          JS
