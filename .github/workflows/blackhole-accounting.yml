name: Black-hole accounting checks
on:
  pull_request:
    paths:
      - 'server/issuer-return-*.js'
      - 'scripts/audit-issuer-returns.js'
      - 'test/issuer-return-*.test.js'
      - 'test/audit-issuer-returns.test.js'
      - '.github/workflows/blackhole-accounting.yml'
  push:
    branches:
      - fix/blackhole-accounting-only-20261027
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Burn accounting
        run: node test/issuer-return-history.test.js
      - name: XRPL scanner
        run: node test/issuer-return-scanner.test.js
      - name: Archive ledger coverage
        run: node test/issuer-return-ledger-coverage.test.js
      - name: Read-only audit
        run: node test/audit-issuer-returns.test.js
