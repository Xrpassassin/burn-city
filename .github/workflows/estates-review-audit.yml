name: Estates review audit
on:
  pull_request:
    paths:
      - 'server/estate-sale-review-audit.js'
      - 'server/estate-sale-review-audit.test.js'
      - '.github/workflows/estates-review-audit.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/estate-sale-review-audit.js
      - run: node server/estate-sale-review-audit.test.js
