name: Estates verified live activation
on:
  push:
    branches: [ops/estates-live-activation-442]
    paths:
      - '.github/workflows/estates-live-activation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_IOV2 || secrets.FLY_IO }}
      ESTATE_EXPECTED_COMMIT: '640d0f6045adeba27a9ce7c47f3b0726fbda0bb2'
      CONFIRM_ESTATES_ACTIVATION: '70-30-realized-earnings-only'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight, bootstrap, verify accounting, and activate the approved gates
        run: node scripts/estate-live-operations.mjs
