name: Estates IMG funding capacity
on:
  pull_request:
    paths:
      - 'server/estate-img-funding-capacity.js'
      - 'server/estate-img-funding-capacity.test.js'
      - '.github/workflows/estates-img-funding.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/estate-img-funding-capacity.js
      - run: node server/estate-img-funding-capacity.test.js
