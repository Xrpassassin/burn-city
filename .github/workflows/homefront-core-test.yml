name: Homefront settlement core checks

on:
  pull_request:
    paths:
      - 'server/homefront-core.js'
      - 'server/homefront-combat.js'
      - 'server/homefront-world.js'
      - 'server/homefront-survival.js'
      - 'server/homefront.js'
      - 'server/server.js'
      - 'server/game.js'
      - 'server/flight-lobby.js'
      - 'client/arena/flight-lobby.html'
      - 'client/js/app.js'
      - 'client/js/airport.js'
      - 'client/js/experience-registry.mjs'
      - 'client/js/experience-registry.test.mjs'
      - 'test/flight-lobby-sim.js'
      - 'test/zombie-helicopter-arrival-sim.js'
      - 'client/arena/homefront.html'
      - 'client/arena/homefront-graveyard-3d.js'
      - 'client/arena/assets/homefront/**'
      - 'client/arena/index.html'
      - 'test/homefront-core-sim.js'
      - 'test/homefront-api-sim.js'
      - 'server/homefront-survival.test.js'
      - 'server/homefront-combat.test.js'
      - 'test/homefront-world-sim.js'
      - 'test/homefront-assets.test.mjs'
      - 'test/homefront-graveyard-3d.test.mjs'
      - 'docs/zombies-homefront.md'
      - 'docs/homefront-playable-handoff.md'
      - 'docs/homefront-survival-cosmetics-open-world.md'
      - 'package.json'
      - '.github/workflows/homefront-core-test.yml'
      - '.github/workflows/homefront-airport-flight.yml'

jobs:
  homefront-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Check server syntax
        run: |
          node --check server/homefront-core.js
          node --check server/homefront-combat.js
          node --check server/homefront-world.js
          node --check server/homefront-survival.js
          node --check server/homefront.js
          node --check server/server.js
          node --check server/game.js
          node --check server/flight-lobby.js
      - name: Check Homefront browser module syntax
        run: node --input-type=module --check < <(node -e 'const fs=require("fs");const s=fs.readFileSync("client/arena/homefront.html","utf8");const m=s.match(/<script type="module">([\s\S]*?)<\/script>/);if(!m)throw Error("Missing Homefront module script");process.stdout.write(m[1])')
      - name: Check flight lobby browser syntax
        run: node -e 'const fs=require("fs");const s=fs.readFileSync("client/arena/flight-lobby.html","utf8");const a=s.indexOf("<script>");const b=s.indexOf("</script>",a);if(a<0||b<0)throw Error("Missing flight-lobby script");new Function(s.slice(a+8,b))'
      - name: Run airport experience registry tests
        run: npm run test:experience-registry
      - name: Run helicopter arrival spawn simulation
        run: npm run test:zombie-arrival
      - name: Run shared flight lobby simulation
        run: npm run test:flight-lobby
      - name: Run Homefront settlement simulation
        run: npm run test:homefront
