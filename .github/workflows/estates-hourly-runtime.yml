name: Estates hourly accounting and settlement software
on:
  pull_request:
    paths:
      - 'server/estate-hourly-*.js'
      - 'server/estate-liquidity-*.js'
      - 'server/estate-treasury-transactions*.js'
      - 'scripts/estate-liquidity-testnet.cjs'
      - 'scripts/estate-live-*.cjs'
      - 'scripts/estate-live-*.mjs'
      - 'server/estate-capital-*.js'
      - 'server/estate-sale-settlement*.js'
      - 'server/estate-sales-runtime*.js'
      - 'server/guard.js'
      - 'client/js/estate-purchase-ui.mjs'
      - 'package.json'
      - 'server/estate-payout-executor*.js'
      - 'server/estate-img-*.js'
      - 'server/server.js'
      - 'server/watch.js'
      - 'scripts/estate-bootstrap.cjs'
      - '.github/workflows/estates-hourly-runtime.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: |
          node --check server/server.js
          node --check scripts/estate-bootstrap.cjs
          node server/estate-liquidity-ledger.test.js
          node scripts/estate-live-operations.test.cjs
          node --check scripts/estate-live-ops.cjs
          node --check scripts/estate-live-operations.mjs
          node server/estate-liquidity-runtime.test.js
          node server/estate-capital-allocation.test.js
          node server/estate-capital-reserve.test.js
          node server/estate-hourly-runtime.test.js
          node server/estate-payout-executor.test.js
          for test in server/estate-img-*.test.js; do node "$test" || exit 1; done
          node test/estate-sales-runtime-http.test.js
          node server/estate-sale-production-gates.test.js
  testnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Public testnet funding and realized XRP payout proof
        run: node scripts/estate-liquidity-testnet.cjs
