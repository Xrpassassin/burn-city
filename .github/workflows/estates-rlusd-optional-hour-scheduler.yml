name: Estates opt-in IMG RLUSD scanner integration
on:
  pull_request:
    paths:
      - 'server/estate-hourly-service.js'
      - 'server/estate-rlusd-optional-hour-scheduler.test.js'
      - '.github/workflows/estates-rlusd-optional-hour-scheduler.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scanner-gated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test fail-closed opt-in scan and old payout isolation
        run: |
          node --check server/estate-hourly-service.js
          node server/estate-rlusd-validated-hour-scanner.test.js
          node server/estate-rlusd-optional-hour-scheduler.test.js
      - name: Confirm no payment activation
        run: echo 'Forward scanner opt-in is disabled by default. This workflow does not enable production scanning, stage a program start, sign transfers, or pay owners.' >> "$GITHUB_STEP_SUMMARY"
