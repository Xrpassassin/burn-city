name: Estates live scanner diagnostics
on:
  push:
    branches: [ops/estates-live-activation-442]
    paths: ['.github/workflows/estates-activation-status.yml']
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Read recent scanner errors
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IOV2 || secrets.FLY_IO }}
        run: |
          flyctl logs --app burn-city-game --no-tail --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{for(const line of s.split("\n")){if(line.includes("[estates-hourly]")){try{const j=JSON.parse(line);console.log(JSON.stringify({timestamp:j.timestamp,message:j.message}));}catch{console.log(line.slice(0,500));}}}});'
      - name: Read deployed status and exact funding requirement
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IOV2 || secrets.FLY_IO }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source=fs.readFileSync('scripts/estate-live-ops.cjs','utf8');
          for(const mode of ['status','preflight']){
            const r=await fetch('https://api.machines.dev/v1/apps/burn-city-game/machines/8d2909be270068/exec',{method:'POST',headers:{Authorization:'Bearer '+process.env.FLY_API_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({command:['node','-e',source,mode,'640d0f6045adeba27a9ce7c47f3b0726fbda0bb2'],timeout:55}),signal:AbortSignal.timeout(60000)});
            if(!r.ok)throw Error('readonly_status_http_'+r.status);
            const result=await r.json();console.log(JSON.stringify(JSON.parse(result.stdout.trim())));
          }
          NODE
