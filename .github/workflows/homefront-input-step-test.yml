name: Homefront input step tests
on:
  push:
    branches: [main]
    paths:
      - 'server/homefront-input-step.js'
      - 'server/homefront-input-step.test.js'
      - 'server/homefront-world.js'
      - 'server/homefront-survival.js'
      - 'server/homefront-survival.test.js'
      - 'test/homefront-input-world-sim.js'
      - 'server/homefront.js'
      - 'test/homefront-input-api-sim.js'
      - 'client/arena/homefront-continuous-input.mjs'
      - 'client/arena/homefront-continuous-input.test.mjs'
      - 'client/arena/homefront-input-snapshot.mjs'
      - 'client/arena/homefront-input-snapshot.test.mjs'
      - 'client/arena/homefront-context-action.mjs'
      - 'client/arena/homefront-context-action.test.mjs'
      - 'client/arena/homefront-graveyard-3d.js'
      - '.github/workflows/homefront-input-step-test.yml'
  pull_request:
    paths:
      - 'server/homefront-input-step.js'
      - 'server/homefront-input-step.test.js'
      - 'server/homefront-world.js'
      - 'server/homefront-survival.js'
      - 'server/homefront-survival.test.js'
      - 'test/homefront-input-world-sim.js'
      - 'server/homefront.js'
      - 'test/homefront-input-api-sim.js'
      - 'client/arena/homefront-continuous-input.mjs'
      - 'client/arena/homefront-continuous-input.test.mjs'
      - 'client/arena/homefront-input-snapshot.mjs'
      - 'client/arena/homefront-input-snapshot.test.mjs'
      - 'client/arena/homefront-context-action.mjs'
      - 'client/arena/homefront-context-action.test.mjs'
      - 'client/arena/homefront-graveyard-3d.js'
      - '.github/workflows/homefront-input-step-test.yml'
jobs:
  input-step:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node server/homefront-input-step.test.js
      - run: node server/homefront-survival.test.js
      - run: node test/homefront-input-world-sim.js
      - run: node test/homefront-input-api-sim.js
      - run: node client/arena/homefront-continuous-input.test.mjs
      - run: node client/arena/homefront-input-snapshot.test.mjs
      - run: node client/arena/homefront-context-action.test.mjs
