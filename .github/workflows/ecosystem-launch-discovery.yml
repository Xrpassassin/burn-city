name: Ecosystem issuance discovery checks
on:
  pull_request:
    paths:
      - 'scripts/discover-ecosystem-launch.js'
      - 'test/discover-ecosystem-launch.test.js'
      - '.github/workflows/ecosystem-launch-discovery.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test/discover-ecosystem-launch.test.js
      - run: node --check scripts/discover-ecosystem-launch.js
