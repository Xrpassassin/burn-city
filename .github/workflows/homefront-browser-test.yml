name: Homefront playable browser checks

on:
  pull_request:
    paths:
      - 'client/arena/homefront*'
      - 'server/homefront*'
      - 'client/js/walker.js'
      - 'scripts/homefront-browser-test.mjs'
      - '.github/workflows/homefront-browser-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/homefront-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homefront-browser-preview
          path: homefront-browser-preview/
          if-no-files-found: ignore
