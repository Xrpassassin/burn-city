name: Estates IMG XRPL receipt verification
on:
  pull_request:
    paths:
      - 'server/estate-img-xrpl-receipt-verifier.js'
      - 'server/estate-img-xrpl-receipt-verifier.test.js'
      - '.github/workflows/estates-img-verifier.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node server/estate-img-xrpl-receipt-verifier.test.js
      - run: node server/estate-img-hourly-rewards.test.js
      - run: node server/estate-sale-production-gates.test.js
