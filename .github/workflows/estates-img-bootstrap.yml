name: Estates IMG historical bootstrap
on:
  pull_request:
    paths:
      - 'server/estate-img-historical-bootstrap.js'
      - 'server/estate-img-historical-bootstrap.test.js'
      - '.github/workflows/estates-img-bootstrap.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node server/estate-img-historical-bootstrap.test.js
      - run: node server/estate-img-validated-ledger-scanner.test.js
      - run: node server/estate-sale-production-gates.test.js
