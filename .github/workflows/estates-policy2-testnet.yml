name: Estates policy-v2 verified purchase-to-AMM testnet acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/estate-rlusd-policy2-testnet.cjs'
      - '.github/workflows/estates-policy2-testnet.yml'
      - 'server/estate-liquidity-runtime.js'
      - 'server/estate-rlusd-staged-acquisition-runtime.test.js'
      - 'server/estate-capital-allocation.js'
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax and non-network policy-v2 staging regressions
        run: |
          node --check scripts/estate-rlusd-policy2-testnet.cjs
          node server/estate-rlusd-next-acquisition-stage.test.js
          node server/estate-rlusd-acquisition-ratio-preview.test.js
          node server/estate-rlusd-staged-acquisition-runtime.test.js
      - name: Actual signed and validated public-testnet purchase to AMM
        env:
          ESTATE_TESTNET_WSS: wss://s.altnet.rippletest.net:51233
        run: node scripts/estate-rlusd-policy2-testnet.cjs
