name: IMG PLX validated AMM inspection
on:
  pull_request:
    paths:
      - 'server/img-plx-amm-ledger.js'
      - 'server/img-plx-amm-ledger.test.js'
      - '.github/workflows/img-plx-amm-ledger.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node server/img-plx-amm-ledger.test.js
      - run: node server/img-plx-amm-deposit-draft.test.js
      - run: node server/estate-sale-production-gates.test.js
