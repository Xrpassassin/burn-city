name: Homefront Pine Crossing relay expedition
on:
  pull_request:
    paths:
      - 'client/arena/homefront-pine-crossing.mjs'
      - 'client/arena/homefront-pine-scenery.mjs'
      - 'server/homefront-loot.js'
      - 'server/homefront-collision.js'
      - 'test/homefront-pine-relay-sim.mjs'
      - 'test/homefront-single-overworld.test.js'
      - 'server/homefront-world.js'
      - 'server/homefront-vehicles.js'
      - 'test/homefront-vehicles.test.js'
      - 'test/homefront-rover-api-sim.js'
      - 'test/homefront-rover-corridors.test.mjs'
      - 'client/arena/homefront-vehicle-corridors.mjs'
      - 'client/arena/homefront-rover-*'
      - 'client/arena/homefront-world-generation.mjs'
      - 'test/homefront-explore-multiplayer-sim.js'
      - '.github/workflows/homefront-pine-relay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Walkable relay route and collision / risk / cooldown
        run: node test/homefront-pine-relay-sim.mjs
      - name: Existing Homefront collision and loot invariants
        run: node server/homefront-collision.test.js && node server/homefront-loot.test.js
      - name: Shared world, survivor Homefront separation, and persistent gate assignments
        run: node test/homefront-world-sim.js && node test/homefront-single-overworld.test.js && node test/homefront-vehicles.test.js && node test/homefront-rover-api-sim.js && node test/homefront-rover-corridors.test.mjs && node test/homefront-explore-multiplayer-sim.js
