name: Estates review authorization
on:
  pull_request:
    paths:
      - 'server/estate-sale-review-auth.js'
      - 'server/estate-sale-review-auth.test.js'
      - 'server/server.js'
      - '.github/workflows/estates-review-auth.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/server.js
      - run: node server/estate-sale-review-auth.test.js
      - run: node server/estate-sale-late-review-queue.test.js
      - run: node server/estate-sale-review-audit.test.js
