name: Estates IMG earnings evidence
on:
  pull_request:
    paths:
      - 'server/estate-img-earnings-evidence.js'
      - 'server/estate-img-earnings-evidence.test.js'
      - 'server/estate-img-receipt-journal.js'
      - '.github/workflows/estates-img-earnings-evidence.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/estate-img-earnings-evidence.js
      - run: node server/estate-img-earnings-evidence.test.js
