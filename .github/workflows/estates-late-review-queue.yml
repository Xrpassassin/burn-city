name: Estates late-payment review queue
on:
  pull_request:
    paths:
      - 'server/estate-sale-late-review-queue.js'
      - 'server/estate-sale-late-review-queue.test.js'
      - '.github/workflows/estates-late-review-queue.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/estate-sale-late-review-queue.js
      - run: node server/estate-sale-late-review-queue.test.js
