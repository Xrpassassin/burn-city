name: Estates full purchase lifecycle
on:
  pull_request:
    paths:
      - 'server/estate-sale-lifecycle.test.js'
      - '.github/workflows/estates-sale-lifecycle.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node server/estate-sale-lifecycle.test.js
      - run: node server/estate-sale-payment-verifier.test.js
      - run: node server/estate-sale-orchestrator.test.js
