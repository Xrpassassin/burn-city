name: Reconcile confirmed Estates PLX exit
on:
  push:
    branches: [ops/estates-rlusd-audit]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify confirmed withdrawal and replacement LP
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IOV2 || secrets.FLY_IO }}
          CONFIRMED_EXIT_APPLY: '0'
        run: |
          node <<'NODE'
          const fs=require('node:fs'),expected='73061880b7cff003ff881d112f951d4f50d135ea',source=fs.readFileSync('.ops/confirmed-plx-exit.cjs','utf8');
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let ready=false;
            for(let i=0;i<45;i++){try{const r=await fetch('https://burn-city-game.fly.dev/api/deploy-version',{signal:AbortSignal.timeout(5000)}),v=await r.json();if(v.source==='github-volume'&&v.commit===expected){ready=true;break;}}catch{}await delay(4000);}
            if(!ready)throw Error('expected_deployment_not_live');
            const mode=process.env.CONFIRMED_EXIT_APPLY==='1'?'apply':'inspect';
            const r=await fetch('https://api.machines.dev/v1/apps/burn-city-game/machines/8d2909be270068/exec',{method:'POST',headers:{Authorization:'Bearer '+process.env.FLY_API_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({command:['node','-e',source,mode,expected],timeout:55}),signal:AbortSignal.timeout(60000)});
            if(!r.ok)throw Error('confirmed_exit_http_'+r.status);
            const d=await r.json();console.log(d.stdout);if(d.exit_code!==0){console.error(d.stderr);throw Error('confirmed_exit_check_failed');}
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
