name: Estates validated AMM transactions
on:
  pull_request:
    paths:
      - 'server/estate-amm-tx-inspector.js'
      - 'server/estate-amm-tx-inspector.test.js'
      - '.github/workflows/estates-amm-tx-inspector.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/estate-amm-tx-inspector.js
      - run: node server/estate-amm-tx-inspector.test.js
