name: Estates verified AMM reconciliation
on:
  pull_request:
    paths:
      - 'server/estate-amm-verified-reconciliation.js'
      - 'server/estate-amm-verified-reconciliation.test.js'
      - 'server/estate-amm-identity.js'
      - 'server/estate-amm-tx-reconciliation.js'
      - '.github/workflows/estates-amm-verified-reconciliation.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/estate-amm-verified-reconciliation.js
      - run: node server/estate-amm-verified-reconciliation.test.js
