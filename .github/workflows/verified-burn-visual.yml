name: Verified burn visual checks
on:
  pull_request:
    paths:
      - 'client/js/verified-burn-visual*'
      - 'client/js/amm-lock.js'
      - '.github/workflows/verified-burn-visual.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node client/js/verified-burn-visual.test.mjs
