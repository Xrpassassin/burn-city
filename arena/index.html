<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script></head><body>
<button id="exit" hidden style="position:fixed;top:6px;right:8px;z-index:5;padding:8px 14px">✕ Menu</button><div id="hud"><span id="me" hidden style="padding:2px 8px;border-radius:6px;border:2px solid;font-weight:700"></span><span id="info"></span><span id="fuel" hidden><i></i></span></div>

<div id="touch"><div id="tl" style="left:20px"></div><div id="tr" style="right:20px"></div></div><div id="xh" hidden></div><div id="hurt"></div><div id="over" hidden></div><div id="hint" hidden></div>
<script type="module">

const r = new THREE.WebGLRenderer({ antialias: !mobile, powerPreference: 'high-performance' });

$('#exit').onclick = e => { e.stopPropagation(); leave(); };
document.querySelectorAll('[data-m]').forEach(b => b.onclick = async () => {
  leave(); mode = b.dataset.m; $('#exit').hidden = false; const token = localStorage.bcToken || null;
  $('#menu').hidden = true; $('#touch').style.display = mobile ? 'block' : 'none'; $('#fuel').hidden = $('#xh').hidden = $('#hint').hidden = mode !== 'zombie'; $('#tl').textContent = mode === 'tron' ? '◀' : 'MOVE'; $('#tr').textContent = mode === 'tron' ? '▶' : '🔥 FIRE';
  $('#hint').textContent = mode === 'tron' ? '' : mobile ? 'Drag anywhere to aim · hold MOVE to walk · hold FIRE to burn' : 'Click to lock mouse · mouse/Q/E or ←/→ to aim · WASD move · hold click or Space to fire';
  net = new GameNet(WS, mode, { token, look: owned, name: P.get('name') || 'runner' }).on('gameover', e => { overUntil = performance.now() + (e.in || 5) * 1000; overInfo = e; }).on('close', why => leave('Disconnected ' + (why || '')));
  if (mode === 'zombie' && !mobile) r.domElement.requestPointerLock?.()?.catch?.(() => {});
});
// ---- input: keyboard/mouse on PC, two thumb zones on phones ----
addEventListener('keydown', e => { keys[e.code] = 1; if (mode === 'tron' && !e.repeat) { if (/KeyA|ArrowLeft/.test(e.code)) net?.input({ turn: -1 }); if (/KeyD|ArrowRight/.test(e.code)) net?.input({ turn: 1 }); } });

addEventListener('mousemove', e => { if (document.pointerLockElement) yaw -= e.movementX * 0.003; });

addEventListener('keydown', e => { if (e.code === 'Space') { fire = true; e.preventDefault(); } }); addEventListener('keyup', e => { if (e.code === 'Space') fire = false; });
let touchX = null;
const tid = {};
$('#tl').ontouchstart = e => { if (mode === 'tron') net?.input({ turn: -1 }); else keys.KeyW = 1; e.preventDefault(); };
$('#tl').ontouchend = $('#tl').ontouchcancel = () => keys.KeyW = 0;
$('#tr').ontouchstart = e => { if (mode === 'tron') net?.input({ turn: 1 }); else fire = true; e.preventDefault(); };
$('#tr').ontouchend = $('#tr').ontouchcancel = () => fire = false;
addEventListener('touchstart', e => { for (const t of e.changedTouches) tid[t.identifier] = t.clientX; }, { passive: true });
addEventListener('touchmove', e => { if (mode !== 'zombie') return; for (const t of e.changedTouches) { const x0 = tid[t.identifier]; if (x0 !== undefined) yaw -= (t.clientX - x0) * 0.008; tid[t.identifier] = t.clientX; } }, { passive: true });
addEventListener('touchend', e => { for (const t of e.changedTouches) delete tid[t.identifier]; }, { passive: true });
// ---- render pools (no per-frame allocations) ----
const cycles = new Map(), walls = new Map(), MAXZ = 40;
const zMesh = new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.45, 1.1, 3, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }), MAXZ); zMesh.count = 0; scene.add(zMesh);
const flame = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(90), 3)), new THREE.PointsMaterial({ color: 0xff7a1a, size: 0.6, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false })); scene.add(flame);
const others = new THREE.InstancedMesh(new THREE.BoxGeometry(0.6, 1.8, 0.6), new THREE.MeshLambertMaterial({ color: 0xffaa55 }), 16); others.count = 0; scene.add(others);
const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), S1 = new THREE.Vector3(1, 1, 1), UP = new THREE.Vector3(0, 1, 0);
function wall(id) { let w = walls.get(id); if (!w) { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(1200 * 3), 3)); g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(1200 * 4), 4));
  w = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: COL(id), vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide })); w.frustumCulled = false; scene.add(w); walls.set(id, w); } return w; }
// pts = [x, z, ageMs]; alpha fades with age (bright head -> transparent tail), top edge brighter than the base
function drawTrail(id, pts) { const w = wall(id), a = w.geometry.attributes.position.array, c = w.geometry.attributes.color.array, L = net.life || 4000; let n = 0;
  for (let i = 0; i < pts.length - 1 && n < 1190; i++) { const [x1, z1, t1] = pts[i], [x2, z2, t2] = pts[i + 1], f1 = Math.max(0, 1 - t1 / L), f2 = Math.max(0, 1 - t2 / L), a1 = f1 * f1 * 0.9, a2 = f2 * f2 * 0.9;
    for (const [x, y, z, al] of [[x1, 0, z1, a1 * .55], [x2, 0, z2, a2 * .55], [x2, 1.6, z2, a2], [x1, 0, z1, a1 * .55], [x2, 1.6, z2, a2], [x1, 1.6, z1, a1]]) { a[n * 3] = x; a[n * 3 + 1] = y; a[n * 3 + 2] = z; c[n * 4] = c[n * 4 + 1] = c[n * 4 + 2] = 1; c[n * 4 + 3] = al; n++; } }
  w.geometry.setDrawRange(0, n); w.geometry.attributes.position.needsUpdate = true; w.geometry.attributes.color.needsUpdate = true; }
const tags = new Map();
function tag(id) { let t = tags.get(id); const ro = net.roster.get(id) || {}, key = (ro.name || '') + ro.color; if (t && t.userData.key === key) return t;
  if (t) { scene.remove(t); t.material.map.dispose(); t.material.dispose(); }
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64; const x = cv.getContext('2d'); x.font = 'bold 34px system-ui'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.shadowColor = ro.color || '#fff'; x.shadowBlur = 12; x.fillStyle = ro.color || '#fff'; x.fillText((id === net.me ? '▶ ' : '') + (ro.name || 'rider'), 128, 32);
  t = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false })); t.scale.set(4, 1, 1); t.userData.key = key; scene.add(t); tags.set(id, t); return t; }
const DIRYAW = [Math.PI / 2, 0, -Math.PI / 2, Math.PI];
let last = performance.now(), w0, lastHp = 100, overUntil = 0, overInfo = {};
if (P.get('auto')) setTimeout(() => document.querySelector(`[data-m=${P.get('auto')}]`).click(), 300);
r.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  const st = net?.state(); if (st && mode) {
    const me = st.players.find(p => p.id === net.me);
    if (mode === 'tron') {
      const seen = new Set();
      for (const p of st.players) { seen.add(p.id); let c = cycles.get(p.id);
        if (!c) { c = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 2.2), new THREE.MeshBasicMaterial()); scene.add(c); cycles.set(p.id, c); }
        c.material.color.copy(COL(p.id, 'skin')); w0 = wall(p.id); w0.material.color.copy(c.material.color);
        c.visible = !!p.alive; c.position.set(p.x, 0.4, p.z); c.rotation.y = DIRYAW[p.r]; drawTrail(p.id, net.trail(p.id, p.x, p.z, p.alive));
        const tg = tag(p.id); tg.visible = !!p.alive; tg.position.set(p.x, 2.4, p.z); }
      for (const [id, c] of cycles) if (!seen.has(id)) { scene.remove(c); cycles.delete(id); scene.remove(walls.get(id)); walls.delete(id); const t = tags.get(id); if (t) { scene.remove(t); tags.delete(id); } }
      const mc = net.roster.get(net.me)?.color; if (mc) { const e = $('#me'); e.hidden = false; e.style.color = e.style.borderColor = mc; e.style.textShadow = '0 0 8px ' + mc; e.textContent = 'YOU ●'; }
      if (me && !me.alive) { V.set(me.x * 0.3, 95, me.z * 0.3 + 60); cam.position.lerp(V, 1 - Math.exp(-dt * 2)); cam.lookAt(me.x * 0.3, 0, me.z * 0.3); }   // spectate from above while out
      else if (me) { const d = DIRYAW[me.r]; V.set(me.x - Math.sin(d) * 12, 7, me.z - Math.cos(d) * 12); cam.position.distanceTo(V) > 30 ? cam.position.copy(V) : cam.position.lerp(V, 1 - Math.exp(-dt * 5)); cam.lookAt(me.x, 0, me.z); }
      $('#info').textContent = `Light Cycles · ${st.players.filter(p => p.alive).length}/${st.players.length} alive · A/D or tap sides to turn`;
    } else {
      zMesh.count = Math.min(MAXZ, st.zombies.length);

      zMesh.instanceMatrix.needsUpdate = true; if (zMesh.instanceColor) zMesh.instanceColor.needsUpdate = true;
      const ot = st.players.filter(p => p.id !== net.me && p.alive); others.count = ot.length;
      ot.forEach((p, i) => { M.compose(V.set(p.x, 0.9, p.z), Q.identity(), S1); others.setMatrixAt(i, M); }); others.instanceMatrix.needsUpdate = true;
      yaw += ((keys.KeyQ || keys.ArrowLeft ? 1 : 0) - (keys.KeyE || keys.ArrowRight ? 1 : 0)) * dt * 2.4;
      const mz = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0), mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
      net.input({ yaw, mx, mz, fire });
      if (me) { cam.position.set(me.x, 1.6, me.z); cam.rotation.set(0, yaw + Math.PI, 0, 'YXZ');
        const a = flame.geometry.attributes.position.array, fx = Math.sin(yaw), fz = Math.cos(yaw); flame.visible = !!me.firing; flame.material.color.copy(net.roster.get(net.me)?.look?.flame ? COL(net.me, 'flame') : _flame);
        for (let i = 0; i < 30; i++) { const d = 1 + Math.random() * 8, s = (Math.random() - 0.5) * d * 0.6; a[i * 3] = me.x + fx * d + fz * s; a[i * 3 + 1] = 1.2 + (Math.random() - 0.5) * 0.6; a[i * 3 + 2] = me.z + fz * d - fx * s; }
        flame.geometry.attributes.position.needsUpdate = true;

</script><script data-goatcounter="https://shinigsmi.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script></body></html>
