name: Estates selected lot beacon
on:
  pull_request:
    paths:
      - 'client/js/estates-island-live.mjs'
      - '.github/workflows/estates-lot-beacon.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check client/js/estates-island-live.mjs
      - run: node --test client/js/estates-island-scene.test.mjs
