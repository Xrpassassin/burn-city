name: Black-hole accounting checks
on:
  pull_request:
    paths:
      - 'server/issuer-return-*.js'
      - 'server/amm-lock.js'
      - 'client/js/amm-lock.js'
      - 'client/js/verified-supply-visual*'
      - 'test/burn-supply-live.test.js'
      - 'server/burn-launch-*'
      - 'server/burn-supply-reconciliation.js'
      - 'scripts/audit-burn-supply.js'
      - 'test/burn-launch-evidence.test.js'
      - 'test/burn-supply-reconciliation.test.js'
      - 'scripts/audit-issuer-returns.js'
      - 'test/issuer-return-*.test.js'
      - 'test/audit-issuer-returns.test.js'
      - 'client/js/verified-burn-visual*'
      - 'client/js/issuer-return-card*'
      - 'client/js/amm-lock.js'
      - '.github/workflows/blackhole-accounting.yml'
  push:
    branches:
      - fix/blackhole-accounting-only-20261027
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Burn accounting
        run: node test/issuer-return-history.test.js
      - name: XRPL scanner
        run: node test/issuer-return-scanner.test.js
      - name: Archive ledger coverage
        run: node test/issuer-return-ledger-coverage.test.js
      - name: Issuance evidence
        run: node test/issuer-return-issuance-evidence.test.js
      - name: Read-only audit
        run: node test/audit-issuer-returns.test.js
      - name: Historical API contract
        run: node test/issuer-return-api-contract.test.js
      - name: Verified visual and card contract
        run: node client/js/verified-burn-visual.test.mjs && node client/js/issuer-return-card.test.mjs

      - name: BURN supply snapshot without transaction scans
        run: node test/burn-launch-evidence.test.js && node test/burn-supply-reconciliation.test.js

      - name: BURN live supply and visual contract
        run: node test/burn-supply-live.test.js && node client/js/verified-supply-visual.test.mjs
