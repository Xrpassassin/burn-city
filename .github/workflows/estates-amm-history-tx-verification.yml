name: Estates AMM history transaction verification
on:
  pull_request:
    paths:
      - 'server/estate-amm-history-tx-verification.js'
      - 'server/estate-amm-history-tx-verification.test.js'
      - '.github/workflows/estates-amm-history-tx-verification.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/estate-amm-history-tx-verification.js
      - run: node server/estate-amm-history-tx-verification.test.js
