      - 'client/arena/homefront-navigation.test.mjs'
      - 'client/arena/homefront-exploration-guidance.mjs'
      - 'client/arena/homefront-ground-detail.mjs'
      - 'test/homefront-survivor-inspection.test.mjs'
      - 'test/homefront-survivor-economy-sim.js'
      - 'test/homefront-interior-route-sim.js'
      - 'test/homefront-explore-multiplayer-sim.js'
      - 'server/homefront-travel.js'
      - 'client/arena/homefront-travel.mjs'
      - 'client/js/player-motion.mjs'
