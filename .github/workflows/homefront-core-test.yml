      - 'client/arena/homefront-hud.mjs'
      - 'client/arena/homefront-hud.test.mjs'
      - 'client/arena/homefront-jetpack.mjs'
      - 'client/arena/homefront-jetpack.test.mjs'
      - 'server/jetpack.js'
      - 'test/jetpack-pay-sim.js'
      - 'client/js/jetpack-shop.mjs'
      - 'server/homefront-siege.js'
      - 'server/homefront-combat.js'
      - 'server/homefront-world.js'
      - 'server/homefront-terrain.js'
      - 'server/homefront-collision.js'
      - 'server/homefront-environment.js'
      - 'server/homefront-environment.test.js'
      - 'server/homefront-collision.test.js'
      - 'server/homefront-terrain.test.mjs'
      - 'client/arena/homefront-terrain-generation.mjs'
      - 'client/arena/homefront-environment-damage.mjs'
      - 'test/homefront-environment-damage.test.mjs'
      - 'client/arena/homefront-world-generation.mjs'
      - 'client/arena/homefront-exploration-content.mjs'
      - 'client/arena/homefront-exploration-content.test.mjs'
      - 'docs/homefront-exploration-world-content.md'
      - 'server/homefront-survival.js'
      - 'server/homefront-inventory.js'
      - 'server/homefront-inventory.test.js'
      - 'server/homefront.js'
      - 'server/server.js'
      - 'server/game.js'
      - 'server/flight-lobby.js'
      - 'client/arena/flight-lobby.html'
      - 'client/js/app.js'
      - 'client/js/airport.js'
      - 'client/js/experience-registry.mjs'
      - 'client/js/experience-registry.test.mjs'
      - 'test/flight-lobby-sim.js'
      - 'test/zombie-helicopter-arrival-sim.js'
      - 'client/arena/homefront.html'
      - 'client/arena/homefront-graveyard-3d.js'
      - 'client/arena/homefront-landmark-builder.mjs'
      - 'client/arena/homefront-landmark-builder.test.mjs'
      - 'client/arena/homefront-power-station.mjs'
      - 'client/arena/homefront-power-station.test.mjs'
      - 'docs/homefront-ashfall-power-station.md'
      - 'client/arena/homefront-interior-world.mjs'
      - 'client/arena/homefront-interior-world.test.mjs'
      - 'client/arena/homefront-view.mjs'
      - 'client/arena/homefront-view.test.mjs'
      - 'client/arena/assets/homefront/**'
      - 'client/arena/index.html'
      - 'test/homefront-core-sim.js'
      - 'test/homefront-api-sim.js'
      - 'server/homefront-survival.test.js'
      - 'server/homefront-combat.test.js'
      - 'test/homefront-world-sim.js'
      - 'test/homefront-assets.test.mjs'
      - 'test/homefront-graveyard-3d.test.mjs'
      - 'test/homefront-shared-interior-sim.js'
      - 'docs/zombies-homefront.md'
      - 'docs/homefront-playable-handoff.md'
      - 'docs/homefront-survival-cosmetics-open-world.md'
      - 'package.json'
      - '.github/workflows/homefront-core-test.yml'
      - '.github/workflows/homefront-airport-flight.yml'

jobs:
  homefront-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Check server syntax
        run: |
          node --check server/homefront-core.js
          node --check server/homefront-combat.js
          node --check server/homefront-world.js
          node --check server/homefront-terrain.js
          node --check server/homefront-collision.js
          node --check server/homefront-interiors.js
          node --check server/homefront-exploration.js
          node --check server/homefront-interiors.test.js
          node --check server/homefront-environment.js
          node --check server/homefront-survival.js
          node --check server/homefront-inventory.js
          node --check server/homefront.js
          node --check server/homefront-travel.js
          node --check server/homefront-pvp.js
          node --check server/homefront-rpg.js
          node --check server/jetpack.js
          node --check server/server.js
          node --check server/game.js
          node --check server/flight-lobby.js
      - name: Check Homefront browser module syntax
        run: node --input-type=module --check < <(node -e 'const fs=require("fs");const s=fs.readFileSync("client/arena/homefront.html","utf8");const m=s.match(/<script type="module">([\s\S]*?)<\/script>/);if(!m)throw Error("Missing Homefront module script");process.stdout.write(m[1])')
      - name: Check Homefront scene and interior module syntax
        run: |
          node --input-type=module --check < client/arena/homefront-graveyard-3d.js
          node --input-type=module --check < client/arena/homefront-interior-world.mjs
          node --input-type=module --check < client/arena/homefront-power-station.mjs
          node --input-type=module --check < client/arena/homefront-hud.mjs
          node --input-type=module --check < client/arena/homefront-jetpack.mjs
          node --input-type=module --check < client/js/jetpack-shop.mjs
      - name: Check flight lobby browser syntax
        run: node -e 'const fs=require("fs");const s=fs.readFileSync("client/arena/flight-lobby.html","utf8");const a=s.indexOf("<script>");const b=s.indexOf("</script>",a);if(a<0||b<0)throw Error("Missing flight-lobby script");new Function(s.slice(a+8,b))'
      - name: Run airport experience registry tests
        run: npm run test:experience-registry
      - name: Run helicopter arrival spawn simulation
        run: npm run test:zombie-arrival
      - name: Run shared flight lobby simulation
        run: npm run test:flight-lobby
      - name: Run Homefront navigation steering regression
        run: node client/arena/homefront-navigation.test.mjs
      - name: Run Homefront survivor interaction assertions
        run: node test/homefront-survivor-inspection.test.mjs
      - name: Run Homefront settlement simulation
        run: npm run test:homefront
      - name: Run Homefront environment damage and repair tests
        run: node test/homefront-environment-damage.test.mjs
      - name: Run authoritative Homefront environment integration tests
        run: node server/homefront-environment.test.js
      - name: Verify deterministic urban and industrial landmark meshes
        run: node client/arena/homefront-landmark-builder.test.mjs
      - name: Verify off-map Ashfall power-station visuals and mobile budget
        run: node client/arena/homefront-power-station.test.mjs
      - name: Run Homefront 3D scene integration assertions
        run: node test/homefront-graveyard-3d.test.mjs
      - name: Verify multi-account shared Homefront interior occupancy
        run: node test/homefront-shared-interior-sim.js
      - name: Run Homefront view-mode tests
        run: node client/arena/homefront-view.test.mjs
