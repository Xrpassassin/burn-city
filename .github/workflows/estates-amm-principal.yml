name: Estates AMM principal reconciliation
on:
  pull_request:
    paths:
      - 'server/estate-amm-profit-reconciliation.js'
      - 'server/estate-amm-profit-reconciliation.test.js'
      - '.github/workflows/estates-amm-principal.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/estate-amm-profit-reconciliation.js
      - run: node server/estate-amm-profit-reconciliation.test.js
