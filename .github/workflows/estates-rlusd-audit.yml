name: Read-only Estates treasury alert inspection
on:
  push:
    branches: [ops/estates-rlusd-audit]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read treasury pause and journal without mutation
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IOV2 || secrets.FLY_IO }}
        run: |
          node <<'NODE'
          const source="const fs=require('node:fs'),{DatabaseSync}=require('node:sqlite');const root=process.env.DATA_DIR||'/data';const read=n=>{try{return JSON.parse(fs.readFileSync(root+'/'+n,'utf8'));}catch{return null;}};const pause=read('pause.json'),db=new DatabaseSync(root+'/shop.db',{readOnly:true});db.exec('PRAGMA query_only=ON');const has=n=>!!db.prepare(\"SELECT 1 FROM sqlite_master WHERE type='table' AND name=?\").get(n);const unknown=(pause?.unknown||[]).map(u=>({...u,journal:has('estate_treasury_transactions')?db.prepare('SELECT purpose,state,tx_hash FROM estate_treasury_transactions WHERE tx_hash=?').get(u.hash)||null:null}));console.log(JSON.stringify({commit:fs.readFileSync(root+'/gh/SHA','utf8').trim(),pause:{...pause,unknown},flags:{rlusd:process.env.ESTATE_RLUSD_ENABLED==='1',pool:process.env.ESTATE_IMG_RLUSD_POOL_ACCOUNT||null,environmentPause:process.env.PAYOUTS_PAUSED==='true'},pending:has('estate_treasury_transactions')?db.prepare(\"SELECT id,purpose,state,note FROM estate_treasury_transactions WHERE state!='applied'\").all():[],positions:has('estate_liquidity_jobs')?db.prepare('SELECT pair,state,data_json,note FROM estate_liquidity_jobs').all().map(j=>{const d=JSON.parse(j.data_json);return {pair:j.pair,state:j.state,note:j.note,lp:d.lp,lpAccount:d.lpAccount,lpCurrency:d.lpCurrency,basis:d.basis,cash:d.cash,img:d.img,plx:d.plx,residualImg:d.residualImg,residualPlx:d.residualPlx};}):[],allocations:has('estate_capital_allocations')?db.prepare('SELECT policy_version,purchase_drops,img_plx_drops,img_xrp_drops,img_rlusd_drops,operating_reserve_drops FROM estate_capital_allocations').all():[],checkpoint:has('estate_img_scan_watermarks')?db.prepare('SELECT * FROM estate_img_scan_watermarks WHERE id=1').get():null}));db.close();";
          (async()=>{
            const r=await fetch('https://api.machines.dev/v1/apps/burn-city-game/machines/8d2909be270068/exec',{method:'POST',headers:{Authorization:'Bearer '+process.env.FLY_API_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({command:['node','-e',source],timeout:45}),signal:AbortSignal.timeout(55000)});
            if(!r.ok)throw Error('read_only_inspection_http_'+r.status);
            const d=await r.json();console.log(d.stdout);if(d.exit_code!==0)throw Error('read_only_inspection_failed');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
