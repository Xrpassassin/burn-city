name: Vendor attributed realistic Sketchfab infected GLBs (draft branch only)
on:
  push:
    branches: [feature/zombies-original-mode-model-fidelity-20261111]
    paths:
      - 'scripts/import-sketchfab-zombie-assets.py'
      - '.github/workflows/zombies-import-licensed-sketchfab.yml'
permissions:
  contents: write
jobs:
  licensed-asset-import:
    if: "!contains(github.event.head_commit.message, 'vendor(zombies):')"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate third-party attribution and import original Sketchfab GLBs
        run: python scripts/import-sketchfab-zombie-assets.py
      - name: Commit only verified asset bytes to this feature branch
        run: |
          set -eu
          git add client/arena/assets/zombies/zombie-human-aiden.glb
          git add client/arena/assets/zombies/zombie-hazmat-licensed.glb
          git add client/arena/assets/zombies/sketchfab-provenance.json
          if git diff --cached --quiet; then echo "Asset records already current"; exit 0; fi
          git config user.name 'BURN City Asset QA Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "vendor(zombies): verified CC-BY Aiden and hazmat skinned GLBs for visual QA"
          git push origin "HEAD:feature/zombies-original-mode-model-fidelity-20261111"
      - if: failure()
        run: |
          echo "The source may be temporarily unavailable or the clip contract may have changed." >&2
          echo "DO NOT substitute unverified cartoon assets or merge the draft PR." >&2
