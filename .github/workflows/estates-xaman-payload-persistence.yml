name: Estates Xaman payload persistence
on:
  pull_request:
    paths:
      - 'server/estate-sale-xaman-payload-store.js'
      - 'server/estate-sale-xaman-payload-store.test.js'
      - '.github/workflows/estates-xaman-payload-persistence.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/estate-sale-xaman-payload-store.js
      - run: node server/estate-sale-xaman-payload-store.test.js
