name: Estates RLUSD price diagnostics
on:
  pull_request:
    paths:
      - 'server/estate-rlusd-readiness.js'
      - 'server/estate-rlusd-price-diagnostics.test.js'
      - '.github/workflows/estates-rlusd-price-diagnostics.yml'
  push:
    branches: [main]
    paths:
      - 'server/estate-rlusd-readiness.js'
      - 'server/estate-rlusd-price-diagnostics.test.js'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node server/estate-rlusd-price-diagnostics.test.js
