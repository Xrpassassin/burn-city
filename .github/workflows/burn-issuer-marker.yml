name: BURN issuer marker checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node client/js/burn-issuer-marker.test.mjs
