name: Inspect Estates recovery resources
on:
  push:
    branches: [ops/estates-rlusd-audit]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read verification stage and memory without starting a Node worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IOV2 || secrets.FLY_IO }}
        run: |
          node <<'NODE'
          (async()=>{
            const headers={Authorization:'Bearer '+process.env.FLY_API_TOKEN,'Content-Type':'application/json'};
            for(const command of [['cat','/tmp/estate-confirmed-exit-stage.json','/sys/fs/cgroup/memory.max','/sys/fs/cgroup/memory.current'],['ps','-o','pid,comm,rss']]){
              const r=await fetch('https://api.machines.dev/v1/apps/burn-city-game/machines/8d2909be270068/exec',{method:'POST',headers,body:JSON.stringify({command,timeout:10}),signal:AbortSignal.timeout(15000)});
              if(!r.ok)throw Error('resource_read_http_'+r.status);const d=await r.json();console.log(JSON.stringify({command,stdout:d.stdout,stderr:d.stderr,exitCode:d.exit_code}));
            }
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
