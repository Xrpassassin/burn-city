name: Estates IMG hourly reward accounting
on:
  pull_request:
    paths:
      - 'server/estate-img-hourly-rewards.js'
      - 'server/estate-img-hourly-rewards.test.js'
      - '.github/workflows/estates-img-hourly.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node server/estate-img-hourly-rewards.test.js
      - run: node server/estate-sale-production-gates.test.js
