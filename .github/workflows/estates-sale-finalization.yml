name: Estates verified finalization
on:
  pull_request:
    paths:
      - 'server/estate-sale-finalization.js'
      - 'server/estate-sale-finalization.test.js'
      - 'server/estate-sale-settlement.js'
      - 'server/estate-sale-orchestrator.js'
      - 'server/estate-sale-payment-verifier.js'
      - 'server/estate-sale-late-review-queue.js'
      - 'server/estate-sale-late-confirm.test.js'
      - '.github/workflows/estates-sale-finalization.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/estate-sale-finalization.js
      - run: node server/estate-sale-finalization.test.js
      - run: node server/estate-sale-late-confirm.test.js
