name: Estates IMG/RLUSD read-only production preflight
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/estates-rlusd-production-preflight.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/estates-rlusd-production-preflight.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test per-tier purchase principal and market depth guard
        run: |
          node server/estate-rlusd-tier-funding-capacity.test.js
          node server/estate-rlusd-staged-funding-preview.test.js
          node server/estate-rlusd-two-asset-deposit-preview.test.js
          node server/estate-rlusd-acquisition-ratio-preview.test.js
  verify-production:
    # Production credentials: trusted main-branch runs only, behind the protected environment.
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect ACTUAL Fly runtime and public IMG/RLUSD AMM without writes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IOV2 || secrets.FLY_IO }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createRequire} from 'node:module';
          const require=createRequire(process.cwd()+'/package.json');
          const {inspectEstateTierFundingCapacity}=require('./server/estate-rlusd-tier-funding-capacity');
          const catalog=require('./client/data/estate-catalog.json');
          const poolAccount='rhPErqSNp1PzSDTgQpK4F637AEKHfbhR4f';
          const endpoint='https://api.machines.dev/v1/apps/burn-city-game/machines/8d2909be270068/exec';
          if(!process.env.FLY_API_TOKEN)throw Error('fly_credential_missing');
          const headers={Authorization:'Bearer '+process.env.FLY_API_TOKEN,'Content-Type':'application/json'};
          const remote=async(command,{allowBlocked=false}={})=>{
            const response=await fetch(endpoint,{
              method:'POST',headers,body:JSON.stringify({command,timeout:45}),
              signal:AbortSignal.timeout(60000)});
            if(!response.ok)throw Error('fly_readonly_http_'+response.status);
            const result=await response.json();
            let report;
            try{report=JSON.parse(String(result.stdout||'').trim());}
            catch{throw Error('fly_readonly_result_unavailable');}
            if(result.exit_code!==0 &&
              (!allowBlocked||report?.ready!==false||!Array.isArray(report?.blockers)))
              throw Error('fly_readonly_execution_failed');
            return report;
          };
          // This read-only check executes under the production machine's
          // configured issuer/treasury/network, NOT on the GitHub runner.
          const runtime=await remote(['node','-e',
            fs.readFileSync('scripts/estate-runtime-readiness.cjs','utf8')]);
          if(runtime.readOnly!==true)throw Error('unexpected_runtime_probe');
          const pool=await remote(['node',
            '/data/gh/cur/scripts/estate-rlusd-readiness.cjs',poolAccount],
            {allowBlocked:true});
          if(pool.poolAccount!==poolAccount||!Array.isArray(pool.blockers)||
            !Number.isSafeInteger(pool.ledgerIndex))
            throw Error('unexpected_validated_pool_evidence');
          const [deployedResponse,statusResponse]=await Promise.all([
            fetch('https://burn-city-game.fly.dev/api/deploy-version',
              {signal:AbortSignal.timeout(12000)}),
            fetch('https://burn-city-game.fly.dev/api/estates/status',
              {signal:AbortSignal.timeout(12000)})]);
          if(!deployedResponse.ok||!statusResponse.ok)
            throw Error('public_estates_status_unavailable');
          const deployed=await deployedResponse.json(),status=await statusResponse.json();
          if(deployed.source!=='github-volume'||!/^[a-f0-9]{40}$/i.test(deployed.commit||''))
            throw Error('deployment_identity_unavailable');
          if(status.capitalAllocationPolicy?.pair!=='IMG/RLUSD'||
            status.capitalAllocationPolicy?.version!==2||
            status.capitalAllocationPolicy?.imgRlusdBps!==9900)
            throw Error('forward_purchase_policy_mismatch');
          const fundingCapacity=inspectEstateTierFundingCapacity({
            tiers:catalog.tiers,
            indicativeMaxPurchaseDrops:String(pool.indicativeMaxPurchaseDrops)});
          const blockers=[
            ...(fundingCapacity.stagingOrDeeperLiquidityReviewNeeded?[
              'higher_tiers_need_bounded_asset_acquisition_not_amm_deposit_limit']:[]),
            ...(runtime.pauseFile?.paused||runtime.pauseEnvironment?['treasury_paused']:[]),
            ...(!status.salesEnabled?['property_sales_disabled']:[]),
            ...(!status.imgRlusdFundingEnabled?['img_rlusd_funding_disabled']:[]),
            ...(!status.distributionsEnabled?['hourly_distributions_disabled']:[]),
            ...(!status.forwardImgRlusdRewards?.forwardStartStaged?['forward_reward_start_not_verified']:[]),
            ...(!status.forwardImgRlusdRewards?.settlementEngineConnected?['forward_payout_executor_not_connected']:[]),
            ...(!status.forwardImgRlusdRewards?.verifiedRealizationIngestionConnected?['realized_profit_ingestion_not_connected']:[]),
            ...(!status.forwardImgRlusdRewards?.validatedHourScannerEnabled?['validated_hour_scanner_disabled']:[]),
            ...(status.imgRlusdPoolAccount!==poolAccount?['pool_account_not_configured']:[]),
            ...(!runtime.signerMatchesEstateTreasury?['treasury_signer_not_verified']:[]),
            ...(!runtime.xamanConfigured?['xaman_credentials_not_verified']:[]),
            ...pool.blockers.map(x=>'pool_'+x)
          ];
          if(pool.ready!==true&&!pool.blockers.length)
            throw Error('incomplete_pool_readiness_evidence');
          const output={
            readOnly:true,deployedCommit:deployed.commit,
            treasuryPauseObserved:runtime.pauseFile?.paused===true||runtime.pauseEnvironment,
            purchaseSalesEnabled:status.salesEnabled,
            futureRewardsPayable:status.forwardImgRlusdRewards.livePaymentsEnabled===true,
            poolIdentityConfirmed:pool.poolAccount===poolAccount,
            poolLedgerIndex:pool.ledgerIndex,
            priceDeviationBps:pool.priceDeviationBps,
            indicativeMaxPurchaseDrops:pool.indicativeMaxPurchaseDrops,
            poolTrustlineReadiness:pool.trustlines,
            tierFundingCapacity:fundingCapacity.tiers,
            tiersNeedingFundingDepthReview:fundingCapacity.tiersExceedingIndicativeSinglePurchaseCapacity,
            singleTradeCapacityDoesNotCapProportionalTwoSidedDeposits:true,
            purchaseCapitalArrivesAsXrpAndNeedsAssetAcquisition:true,
            stagedFundingIsOnlyReadOnlyPreview:true,
            blockers,
            legalApprovalIndependentlyVerified:false,
            actualCustomerPaymentTestVerified:false,
            launchAuthorized:false,
            financialChangesPerformed:false
          };
          console.log('ESTATES_IMG_RLUSD_PRODUCTION_PREFLIGHT='+JSON.stringify(output));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## IMG/RLUSD production launch preflight (read-only)\n\n'+
            '- Deployed commit: `'+deployed.commit.slice(0,12)+'`\n'+
            '- Validated pool ledger: '+pool.ledgerIndex+'\n'+
            '- Pool ready for verified identity/trustline/market checks: '+pool.ready+'\n'+
            '- Tiers needing asset-acquisition depth planning (NOT a two-asset deposit size cap): '+
              (fundingCapacity.tiersExceedingIndicativeSinglePurchaseCapacity.join(', ')||'none')+'\n'+
            '- Proportional IMG/RLUSD deposits are not capped by single-trade market depth; inventory and pool ratio must validate separately.\n'+
            '- Live purchases: '+status.salesEnabled+'; future rewards payable: '+output.futureRewardsPayable+'\n'+
            '- Technical blockers: '+(blockers.length?blockers.join(', '):'none reported')+'\n\n'+
            '**This audit never authorizes legal release, unpauses treasury, signs, transfers, or starts distributions.**\n');
          // Do not falsely mark blocked production as an Actions failure.
          // A SUCCESS here means we collected verifiable launch blockers,
          // NOT that purchase or reward activation is approved.
          if(status.salesEnabled&&
             (runtime.pauseFile?.paused||runtime.pauseEnvironment||
              !runtime.xamanConfigured||!runtime.signerMatchesEstateTreasury))
            throw Error('unsafe_open_sales_detected');
          NODE
