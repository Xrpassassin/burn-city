<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Burn City — Arena</title>
<style>html,body{margin:0;height:100%;background:#050208;color:#ffd9a0;font:14px system-ui;overflow:hidden;touch-action:none}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:12px;pointer-events:none;text-shadow:0 0 6px #f60}
[hidden]{display:none!important}#menu{position:fixed;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0009}
button{background:#2a0d00;color:#ffb060;border:1px solid #f60;border-radius:8px;padding:12px 20px;font-size:16px}
#fuel{width:120px;height:8px;border:1px solid #f60}#fuel i{display:block;height:100%;background:#f80}
#qr img{width:200px;background:#fff;padding:6px;border-radius:8px}.small{font-size:12px;opacity:.7;max-width:320px;text-align:center}
#touch{position:fixed;bottom:0;left:0;right:0;height:40%;display:none}#touch div{position:absolute;bottom:20px;width:90px;height:90px;border:2px solid #f604;border-radius:50%}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script></head><body>
<div id="hud"><span id="info"></span><span id="fuel" hidden><i></i></span></div>
<div id="menu"><h2>🔥 BURN CITY ARENA</h2><button data-m="tron">Light Cycles</button><button data-m="zombie">Zombie Survival</button>
<a href="../" class="small" style="color:#ffb060">← Back to Burn City</a><div class="small">Free to play. <button id="signin">Sign in with XAMAN</button></div>
<div id="price" class="small"></div><div id="qr"></div><div id="shop" class="small"></div><div id="lb" class="small"></div>
<div class="small">Cosmetics only, never stronger. 32.2% of every sale is burned as BURN. Weekly IMG leaderboard prizes need no purchase.</div></div>
<div id="touch"><div id="tl" style="left:20px"></div><div id="tr" style="right:20px"></div></div>
<script type="module">
import * as THREE from 'three'; import { GameNet, signIn, buy } from './net.js';
const P = new URLSearchParams(location.search), API = P.get('api') || (/fly\.dev$|localhost/.test(location.hostname) ? location.origin : 'https://burn-city-game.fly.dev'), WS = API.replace(/^http/, 'ws');
const $ = s => document.querySelector(s), mobile = matchMedia('(pointer:coarse)').matches;
const qr = x => $('#qr').innerHTML = `<img src="${x.qr}"><div class=small>Scan with XAMAN</div>`;
let owned = [];
async function loadShop() {
  const s = await (await fetch(API + '/api/shop', { headers: { authorization: 'Bearer ' + (localStorage.bcToken || '') } })).json(); owned = s.owned;
  if (!s.available) { $('#shop').textContent = '🛒 Cosmetic shop: coming soon'; } else
  $('#shop').innerHTML = s.items.map(i => `<button data-buy="${i.id}" style="border-color:${i.color}">${i.name} · ${owned.includes(i.id) ? 'owned' : i.xrp + ' XRP'}</button>`).join(' ');
  $('#shop').querySelectorAll('[data-buy]').forEach(b => b.onclick = async () => { if (!localStorage.bcToken) return $('#price').textContent = 'Sign in first';
    try { await buy(API, b.dataset.buy, { onQr: qr }); $('#qr').innerHTML = ''; loadShop(); } catch (e) { $('#price').textContent = 'Not purchased: ' + e.message; } });
  const lb = await (await fetch(API + '/api/leaderboard')).json();
  $('#lb').innerHTML = `<b>Week ${lb.week}</b><br>` + lb.top.map((e, i) => `${i + 1}. ${e.acct.slice(0, 6)}… ${e.kills} kills`).join('<br>');
}
loadShop(); $('#price').textContent = localStorage.bcAcct ? 'Signed in ' + localStorage.bcAcct.slice(0, 8) + '…' : 'Playing as guest (not on leaderboard)';
$('#signin').onclick = async () => { try { const v = await signIn(API, { onQr: qr }); $('#qr').innerHTML = ''; $('#price').textContent = 'Signed in ' + v.account.slice(0, 8) + '…'; loadShop(); } catch (e) { $('#price').textContent = e.message; } };
const r = new THREE.WebGLRenderer({ antialias: !mobile, powerPreference: 'high-performance' });
r.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.5 : 2)); r.setSize(innerWidth, innerHeight); document.body.prepend(r.domElement);
const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x050208, 40, 180); scene.background = new THREE.Color(0x050208);
const cam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 400);
addEventListener('resize', () => { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
scene.add(new THREE.HemisphereLight(0xffaa66, 0x220011, 1.2), new THREE.GridHelper(240, 60, 0xff4400, 0x331100));
const LOOK = { skin_ember: '#ff5a1f', skin_chrome: '#c8d4e0', skin_ghost: '#7af0ff', trail_gold: '#ffd24a', trail_plasma: '#c04bff', flame_blue: '#3aa0ff', flame_green: '#5aff4a', flame_burnxrp: '#ff2a00' };
const COL = (id, kind = 'trail') => { const l = net?.roster.get(id)?.look?.[kind]; return l ? new THREE.Color(LOOK[l]) : new THREE.Color().setHSL((id * 0.137) % 1, 1, 0.55); };
let net, mode, yaw = 0, keys = {}, fire = false;
document.querySelectorAll('[data-m]').forEach(b => b.onclick = async () => {
  mode = b.dataset.m; const token = localStorage.bcToken || null;
  $('#menu').hidden = true; $('#touch').style.display = mobile ? 'block' : 'none'; $('#fuel').hidden = mode !== 'zombie';
  net = new GameNet(WS, mode, { token, look: owned, name: P.get('name') || 'runner' }).on('close', why => { $('#menu').hidden = false; $('#price').textContent = 'Disconnected ' + (why || ''); });
  if (mode === 'zombie' && !mobile) r.domElement.requestPointerLock?.()?.catch?.(() => {});
});
// ---- input: keyboard/mouse on PC, two thumb zones on phones ----
addEventListener('keydown', e => { keys[e.code] = 1; if (mode === 'tron' && !e.repeat) { if (/KeyA|ArrowLeft/.test(e.code)) net?.input({ turn: -1 }); if (/KeyD|ArrowRight/.test(e.code)) net?.input({ turn: 1 }); } });
addEventListener('keyup', e => keys[e.code] = 0);
addEventListener('mousemove', e => { if (document.pointerLockElement) yaw -= e.movementX * 0.003; });
addEventListener('mousedown', () => fire = true); addEventListener('mouseup', () => fire = false);
let touchX = null;
$('#tl').ontouchstart = e => { if (mode === 'tron') net?.input({ turn: -1 }); else keys.KeyW = 1; e.preventDefault(); };
$('#tl').ontouchend = () => keys.KeyW = 0;
$('#tr').ontouchstart = e => { if (mode === 'tron') net?.input({ turn: 1 }); else fire = true; e.preventDefault(); };
$('#tr').ontouchend = () => fire = false;
r.domElement.addEventListener('touchmove', e => { const x = e.touches[0].clientX; if (touchX !== null) yaw -= (x - touchX) * 0.006; touchX = x; });
r.domElement.addEventListener('touchend', () => touchX = null);
// ---- render pools (no per-frame allocations) ----
const cycles = new Map(), walls = new Map(), MAXZ = 40;
const zMesh = new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.35, 1, 3, 6), new THREE.MeshLambertMaterial({ color: 0x55aa44 }), MAXZ); zMesh.count = 0; scene.add(zMesh);
const flame = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(90), 3)), new THREE.PointsMaterial({ color: 0xff7a1a, size: 0.6, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false })); scene.add(flame);
const others = new THREE.InstancedMesh(new THREE.BoxGeometry(0.6, 1.8, 0.6), new THREE.MeshLambertMaterial({ color: 0xffaa55 }), 16); others.count = 0; scene.add(others);
const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), S1 = new THREE.Vector3(1, 1, 1), UP = new THREE.Vector3(0, 1, 0);
function wall(id) { let w = walls.get(id); if (!w) { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(1200 * 3), 3));
  w = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: COL(id), transparent: true, opacity: 0.75, side: THREE.DoubleSide })); scene.add(w); walls.set(id, w); } return w; }
function drawTrail(id, pts) { const w = wall(id), a = w.geometry.attributes.position.array; let n = 0;
  for (let i = 0; i < pts.length - 1 && n < 1190; i++) { const [x1, z1] = pts[i], [x2, z2] = pts[i + 1];
    for (const [x, y, z] of [[x1, 0, z1], [x2, 0, z2], [x2, 1.6, z2], [x1, 0, z1], [x2, 1.6, z2], [x1, 1.6, z1]]) { a[n * 3] = x; a[n * 3 + 1] = y; a[n * 3 + 2] = z; n++; } }
  w.geometry.setDrawRange(0, n); w.geometry.attributes.position.needsUpdate = true; w.geometry.computeBoundingSphere(); }
const DIRYAW = [Math.PI / 2, 0, -Math.PI / 2, Math.PI];
let last = performance.now();
if (P.get('auto')) setTimeout(() => document.querySelector(`[data-m=${P.get('auto')}]`).click(), 300);
r.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  const st = net?.state(); if (st) {
    const me = st.players.find(p => p.id === net.me);
    if (mode === 'tron') {
      const seen = new Set();
      for (const p of st.players) { seen.add(p.id); let c = cycles.get(p.id);
        if (!c) { c = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 2.2), new THREE.MeshBasicMaterial({ color: COL(p.id, 'skin') })); scene.add(c); cycles.set(p.id, c); }
        c.visible = !!p.alive; c.position.set(p.x, 0.4, p.z); c.rotation.y = DIRYAW[p.r]; drawTrail(p.id, net.trail(p.id, p.x, p.z)); }
      for (const [id, c] of cycles) if (!seen.has(id)) { scene.remove(c); cycles.delete(id); scene.remove(walls.get(id)); walls.delete(id); }
      if (me) { const d = DIRYAW[me.r]; V.set(me.x - Math.sin(d) * 12, 7, me.z - Math.cos(d) * 12); cam.position.distanceTo(V) > 30 ? cam.position.copy(V) : cam.position.lerp(V, 1 - Math.exp(-dt * 5)); cam.lookAt(me.x, 0, me.z); }
      $('#info').textContent = `Light Cycles · ${st.players.filter(p => p.alive).length}/${st.players.length} alive · A/D or tap sides to turn`;
    } else {
      zMesh.count = Math.min(MAXZ, st.zombies.length);
      for (let i = 0; i < zMesh.count; i++) { const z = st.zombies[i]; M.compose(V.set(z.x, 0.85, z.z), Q.identity(), S1); zMesh.setMatrixAt(i, M); zMesh.setColorAt(i, z.burn ? _hot : _cold); }
      zMesh.instanceMatrix.needsUpdate = true; if (zMesh.instanceColor) zMesh.instanceColor.needsUpdate = true;
      const ot = st.players.filter(p => p.id !== net.me && p.alive); others.count = ot.length;
      ot.forEach((p, i) => { M.compose(V.set(p.x, 0.9, p.z), Q.identity(), S1); others.setMatrixAt(i, M); }); others.instanceMatrix.needsUpdate = true;
      const mz = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0), mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
      net.input({ yaw, mx, mz, fire });
      if (me) { cam.position.set(me.x, 1.6, me.z); cam.rotation.set(0, yaw + Math.PI, 0, 'YXZ');
        const a = flame.geometry.attributes.position.array, fx = Math.sin(yaw), fz = Math.cos(yaw); flame.visible = !!me.firing; flame.material.color.copy(net.roster.get(net.me)?.look?.flame ? COL(net.me, 'flame') : _flame);
        for (let i = 0; i < 30; i++) { const d = 1 + Math.random() * 8, s = (Math.random() - 0.5) * d * 0.6; a[i * 3] = me.x + fx * d + fz * s; a[i * 3 + 1] = 1.2 + (Math.random() - 0.5) * 0.6; a[i * 3 + 2] = me.z + fz * d - fx * s; }
        flame.geometry.attributes.position.needsUpdate = true;
        $('#fuel').firstChild.style.width = me.fuel + '%'; }
      $('#info').textContent = `Wave ${st.wave} · Team score ${st.score} · HP ${me ? me.hp : 0}${me && !me.alive ? ' · DOWN — back next wave' : ''}`;
    }
  }
  r.render(scene, cam);
});
const _flame = new THREE.Color(0xff7a1a), _hot = new THREE.Color(0xff5500), _cold = new THREE.Color(0x55aa44);
</script><script data-goatcounter="https://shinigsmi.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script></body></html>
