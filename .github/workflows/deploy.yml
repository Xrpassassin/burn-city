name: Deploy to Fly
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check server/server.js && node --check server/game.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Test money + security suites (blocks restart on failure)
        env:
          DRY_RUN: 'true'
        run: |
          export DATA_DIR=$(mktemp -d)
          npm test
      - name: Other game-rule suites
        env:
          DRY_RUN: 'true'
        run: |
          export DATA_DIR=$(mktemp -d)
          npm run test:all
      - name: Restart Fly machine (it pulls main on boot)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "FLY_API_TOKEN secret not set; skipping restart"; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $FLY_API_TOKEN" \
            https://api.machines.dev/v1/apps/burn-city-game/machines/8d2909be270068/restart
          sleep 25
          curl -fsS -o /dev/null -w "%{http_code}\n" https://burn-city-game.fly.dev/
