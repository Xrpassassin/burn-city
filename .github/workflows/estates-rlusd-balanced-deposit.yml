name: Estates RLUSD balanced deposit planner
on:
  pull_request:
    paths:
      - 'server/estate-rlusd-balanced-deposit.js'
      - 'server/estate-rlusd-balanced-deposit.test.js'
      - '.github/workflows/estates-rlusd-balanced-deposit.yml'
  push:
    branches: [main]
    paths:
      - 'server/estate-rlusd-balanced-deposit.js'
      - 'server/estate-rlusd-balanced-deposit.test.js'
      - '.github/workflows/estates-rlusd-balanced-deposit.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node server/estate-rlusd-balanced-deposit.test.js
