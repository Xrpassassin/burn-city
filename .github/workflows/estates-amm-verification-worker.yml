name: Estates AMM verification worker
on:
  pull_request:
    paths:
      - 'server/estate-amm-history-verification-worker.js'
      - 'server/estate-amm-history-verification-worker.test.js'
      - '.github/workflows/estates-amm-verification-worker.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/estate-amm-history-verification-worker.js
      - run: node server/estate-amm-history-verification-worker.test.js
