name: Estates expired payment review safety
on:
  pull_request:
    paths:
      - 'server/estate-sale-payment-verifier.js'
      - 'server/estate-sale-payment-verifier.test.js'
      - 'server/estate-sale-late-reconciliation.js'
      - 'server/estate-sale-late-reconciliation.test.js'
      - '.github/workflows/estates-expired-review.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node server/estate-sale-payment-verifier.test.js
      - run: node server/estate-sale-late-reconciliation.test.js
      - run: node server/estate-sale-lifecycle.test.js
