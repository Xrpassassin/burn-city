      const mc = net.roster.get(net.me)?.color; if (mc) { const e = $('#me'); e.hidden = false; e.style.color = e.style.borderColor = mc; e.style.textShadow = '0 0 8px ' + mc; e.textContent = 'YOU ●'; }
      if (me && !me.alive) { V.set(me.x * 0.3, 95, me.z * 0.3 + 60); cam.position.lerp(V, 1 - Math.exp(-dt * 2)); cam.lookAt(me.x * 0.3, 0, me.z * 0.3); }   // spectate from above while out

      $('#info').textContent = `Light Cycles · ${st.players.filter(p => p.alive).length}/${st.players.length} alive · A/D or tap sides to turn`;
    } else {
      yaw += ((keys.KeyQ || keys.ArrowLeft ? 1 : 0) - (keys.KeyE || keys.ArrowRight ? 1 : 0)) * dt * 2.4;
      let mz = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0), mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);

        pred.moving = l > 0.1; }
      const flameCol = net.roster.get(net.me)?.look?.flame ? COL(net.me, 'flame') : null;
      FX.update(dt, st, me && me.alive && pred ? { x: pred.x, z: pred.z, yaw, firing: !!me.firing, moving: pred.moving } : null, net.me, id => COL(id, 'skin'), flameCol);
      if (me) { const px = pred ? pred.x : me.x, pz = pred ? pred.z : me.z; cam.position.set(px, 1.6 + (pred?.moving ? Math.sin(now / 120) * 0.03 : 0), pz); cam.rotation.set(pitch, yaw + Math.PI, 0, 'YXZ');
        $('#fuel').firstChild.style.width = me.fuel + '%'; }

    }
  }
  r.render(scene, cam);
});
