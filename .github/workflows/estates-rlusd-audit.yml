name: Read-only Estates treasury alert inspection
on:
  push:
    branches: [ops/estates-rlusd-audit]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read treasury pause and journal without mutation
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IOV2 || secrets.FLY_IO }}
        run: |
          node <<'NODE'
          const source="const fs=require('node:fs');let stage=null;try{stage=JSON.parse(fs.readFileSync('/tmp/estate-confirmed-exit-stage.json','utf8'));}catch{}const processes=[];for(const pid of fs.readdirSync('/proc').filter(p=>/^\\d+$/.test(p))){try{const a=fs.readFileSync('/proc/'+pid+'/cmdline','utf8').split('\\0'),evalRun=a[1]==='-e'&&a[2]?.includes('single_confirmed_source_position_required')&&a[3]==='inspect',fileRun=a[1]?.startsWith('/tmp/bc-plx-exit-')&&a[2]==='inspect';if(evalRun||fileRun){const s=fs.readFileSync('/proc/'+pid+'/status','utf8');processes.push({pid:Number(pid),role:evalRun?'owned_inspect_eval':'owned_inspect_file',state:s.match(/^State:\\s*(.*)$/m)?.[1],rss:s.match(/^VmRSS:\\s*(.*)$/m)?.[1]});}}catch{}}console.log(JSON.stringify({stage,processes}));";
          (async()=>{
            const r=await fetch('https://api.machines.dev/v1/apps/burn-city-game/machines/8d2909be270068/exec',{method:'POST',headers:{Authorization:'Bearer '+process.env.FLY_API_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({command:['node','-e',source],timeout:45}),signal:AbortSignal.timeout(55000)});
            if(!r.ok)throw Error('read_only_inspection_http_'+r.status);
            const d=await r.json();console.log(d.stdout);if(d.exit_code!==0)throw Error('read_only_inspection_failed');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
